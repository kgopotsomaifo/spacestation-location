<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--jQuery library imported-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <!--JavaScript file -->
    <script type="text/javascript" src="main.js" defer></script>

    <title>ISS Position</title>
  </head>
  <body>
    <!--Display position in longitude and latitude-->
    <h1><u>International Space Station Position</u></h1>

    <!--Table to display information about satellite-->
    <table>
      <tr>
        <td>Longitude:</td>
        <td id="long"></td>
      </tr>
      <tr>
        <td>Latitude:</td>
        <td id="lat"></td>
      </tr>
      <tr>
        <td>Time:</td>
        <td id="timeUpdate"></td>
      </tr>
    </table>
  </body>
</html>
